  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#27253b;background:#f6f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 28px}button,input{font:inherit}button{cursor:pointer}main{width:min(1112px,100%);min-height:654px;display:grid;grid-template-columns:1.08fr 1fr;background:white;border:1px solid #e8e5f0;border-radius:24px;overflow:hidden;box-shadow:0 20px 70px #35245d09}.story{padding:44px 46px;background:#f0ecfa;position:relative;overflow:hidden;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:650;letter-spacing:.3px}.brand-icon{width:38px;height:38px;border-radius:11px;background:#7950e8;color:white;display:grid;place-items:center}.brand-icon svg{width:24px;height:24px}.eyebrow{font-size:10px;color:#86749f;letter-spacing:2.4px;margin:70px 0 17px}.story h1{font-size:38px;line-height:1.5;letter-spacing:-1px;font-weight:650;margin:0}.story h1 span{color:#7950e8}.description{font-size:14px;line-height:1.9;color:#7e748f;margin:19px 0 0;max-width:340px}.graphic{height:145px;margin:38px 0 28px;position:relative}.graphic svg{width:100%;height:100%;overflow:visible}.capabilities{display:flex;gap:20px;margin-top:auto;color:#7d6f92;font-size:12px}.capabilities span{display:flex;gap:6px;align-items:center}.capabilities i{height:5px;width:5px;background:#a38acb;border-radius:50%}.login{padding:72px 62px 40px;display:flex;flex-direction:column}.login-eyebrow{font-size:10px;letter-spacing:2px;color:#9c96ac;margin:0 0 16px}.login h2{font-size:27px;letter-spacing:-.5px;margin:0 0 12px;font-weight:650}.subtitle{font-size:13px;color:#918a9f;line-height:1.8;margin:0 0 35px}label.field{display:block;font-size:13px;color:#52495f;margin-bottom:21px}.field-label{display:block;margin-bottom:10px}.input-wrap{position:relative}.input-icon{position:absolute;left:14px;top:15px;width:18px;height:18px;color:#aaa2b9;pointer-events:none}input[type=text],input[type=password]{width:100%;height:48px;border:1px solid #e4dfee;border-radius:9px;background:white;outline:none;padding:0 43px;color:#332a44;transition:border-color .15s,box-shadow .15s}input::placeholder{color:#b4adbf;font-size:13px}input:focus{border-color:#8c66ed;box-shadow:0 0 0 3px #8050eb0d}button:focus-visible,a:focus-visible{outline:3px solid #bba0ff;outline-offset:3px}.show{position:absolute;right:9px;top:8px;width:32px;height:32px;border:0;background:transparent;color:#a098af;display:grid;place-items:center;border-radius:6px}.show:hover{background:#f4f0fc;color:#7950e8}.show svg{width:18px;height:18px}.options{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#91879f;margin:2px 0 23px}.remember{display:flex;gap:7px;align-items:center;cursor:pointer}.remember input{accent-color:#7950e8;width:14px;height:14px;margin:0}.submit{height:48px;width:100%;border:0;border-radius:9px;background:#7950e8;color:white;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 5px 12px #7950e820;transition:background .15s,transform .15s}.submit:hover{background:#6c40db}.submit:active{transform:translateY(1px)}.submit:disabled{opacity:.65;cursor:wait}.error{font-size:12px;color:#ba3e51;line-height:1.6;min-height:24px;margin:12px 0 0}.help{margin-top:15px;padding-top:22px;border-top:1px solid #f0edf5;display:flex;gap:9px;align-items:flex-start;color:#a19aaa;font-size:11px;line-height:1.8}.help svg{flex-shrink:0;width:15px;height:15px;margin-top:2px}.foot{margin-top:auto;padding-top:28px;color:#b4adbf;font-size:10px;letter-spacing:1.5px}footer{margin:24px 0 0;font-size:11px;color:#aaa2b7;letter-spacing:.3px}svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}@media(max-width:900px){.story{padding:38px 30px}.login{padding:64px 34px 36px}.story h1{font-size:31px}.capabilities{gap:12px;font-size:11px}}@media(max-width:660px){body{padding:22px 16px}.story{padding:25px 26px 28px}.brand{font-size:15px}.brand-icon{width:33px;height:33px}.eyebrow{margin:28px 0 12px}.story h1{font-size:26px;line-height:1.45}.story h1 br{display:block}.description{font-size:12px;margin-top:12px;max-width:none}.graphic,.capabilities{display:none}main{grid-template-columns:1fr;border-radius:18px;min-height:0}.login{padding:32px 26px 26px}.login-eyebrow{display:none}.login h2{font-size:23px}.subtitle{margin-bottom:25px}.foot{padding-top:22px}footer{font-size:10px;margin-top:20px}}

<body>
<main>
  <section class="story" aria-label="市场研究工作空间">
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17v-6m5 6V7m5 10v-4m5 4V3M3 21h18"/></svg></span>市场情报驾驶舱</div>
    <p class="eyebrow">MARKET INTELLIGENCE WORKSPACE</p>
    <h1>看见市场变化<br><span>找到下一步增长</span></h1>
    <p class="description">连接市场、品牌与渠道数据，<br>让每一次研究，都成为决策的依据。</p>
    <div class="graphic" aria-hidden="true"><svg viewBox="0 0 430 145"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9672ec" stop-opacity=".19"/><stop offset="1" stop-color="#9672ec" stop-opacity="0"/></linearGradient></defs><g stroke="#ddd5ed" stroke-width=".7"><path d="M0 25h430M0 65h430M0 105h430" stroke-dasharray="3 6"/></g><path d="M0 116C35 118 42 91 73 94S114 108 145 73S184 80 216 61S261 72 291 39S340 55 366 27S401 24 430 7V145H0Z" fill="url(#area)" stroke="none"/><path d="M0 116C35 118 42 91 73 94S114 108 145 73S184 80 216 61S261 72 291 39S340 55 366 27S401 24 430 7" stroke="#9470df" stroke-width="2.3"/><path d="M0 130C60 110 70 125 110 108S175 116 216 93S280 101 319 76S381 88 430 59" stroke="#c8b9e4" stroke-dasharray="4 6"/><circle cx="291" cy="39" r="5" fill="#9470df" stroke="#f0ecfa" stroke-width="3"/></svg></div>
    <div class="capabilities"><span><i></i>市场监控</span><span><i></i>竞品追踪</span><span><i></i>分析报告</span></div>
  </section>
  <section class="login">
    <p class="login-eyebrow">WELCOME TO YOUR WORKSPACE</p>
    <h2>登录工作空间</h2><p class="subtitle">欢迎回来，输入账号和密码继续研究。</p>
    <form id="loginForm" action="/auth/login" method="post">
      <label class="field"><span class="field-label">账号</span><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" maxlength="100" required></div></label>
      <label class="field"><span class="field-label">密码</span><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="256" required><button type="button" class="show" id="showPassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label>
      <div class="options"><label class="remember"><input type="checkbox" name="remember" value="1">保持登录 7 天</label><span>授权成员访问</span></div>
      <button class="submit" id="submit" type="submit"><span>登录驾驶舱</span><span aria-hidden="true">→</span></button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>
    <div class="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><span>请使用管理员分配的网站账号。<br>忘记密码或需要访问权限，请联系管理员。</span></div>
    <div class="foot">INSPIRE · RESEARCH WORKSPACE</div>
  </section>
</main>
<footer>市场情报驾驶舱 · 让数据连接决策</footer>
<script>
const form=document.querySelector('#loginForm'),error=document.querySelector('#error'),submit=document.querySelector('#submit');
document.querySelector('#showPassword').addEventListener('click',e=>{const field=document.querySelector('#password'),show=field.type==='password';field.type=show?'text':'password';e.currentTarget.setAttribute('aria-label',show?'隐藏密码':'显示密码');e.currentTarget.setAttribute('aria-pressed',String(show));});
form.addEventListener('input',()=>{error.textContent='';});
function destination(){const value=new URLSearchParams(location.search).get('next')||'/';try{const url=new URL(value,location.origin);if(url.origin===location.origin&&!url.pathname.startsWith('/auth/')&&url.pathname!=='/login')return url.pathname+url.search+url.hash;}catch{}return '/';}
form.addEventListener('submit',async event=>{event.preventDefault();if(submit.disabled)return;submit.disabled=true;submit.querySelector('span').textContent='正在登录…';error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)),credentials:'same-origin'});const data=await response.json();if(!response.ok){error.textContent=data.error||'暂时无法登录，请稍后重试';if(response.status===401){document.querySelector('#password').focus();document.querySelector('#password').select();}return;}location.replace(window.MarketPages.destination());}catch{error.textContent='网络连接异常，请检查网络后重试';}finally{submit.disabled=false;submit.querySelector('span').textContent='登录驾驶舱';}});
</script>
